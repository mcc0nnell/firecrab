name: Patch nft compatibility

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'fix/ci-m2image-boot'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}

      - name: Use portable numeric DNAT priority
        run: |
          set -euo pipefail
          if ! grep -q 'priority dstnat' firecrab-net-helper/src/firewall.rs; then
            echo 'already patched'
            exit 0
          fi
          sed -i 's/priority dstnat/priority -100/g' firecrab-net-helper/src/firewall.rs
          git diff --check
          grep -n 'type nat hook .* priority -100' firecrab-net-helper/src/firewall.rs

      - name: Test firewall renderer
        run: cargo test -p firecrab-net-helper firewall --locked

      - name: Commit compatibility fix
        run: |
          set -euo pipefail
          git diff --quiet && exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add firecrab-net-helper/src/firewall.rs
          git commit -m 'fix(net): use portable numeric DNAT priority'
          git push origin HEAD:${{ github.head_ref }}
