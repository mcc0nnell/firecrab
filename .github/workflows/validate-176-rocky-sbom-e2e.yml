name: Validate 176 Rocky M2Image SBOM end to end

on:
  pull_request:
    branches: [main]

jobs:
  rocky-x86_64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install host image-build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y e2fsprogs file gzip tar curl zstd xz-utils jq

      - name: Build Rocky M2Image with real rpm DB SBOM
        run: |
          mkdir -p images/compliance
          sudo env \
            M2IMAGE_ARCH=x86_64 \
            M2IMAGE_DISTRO_SERIES=9.8 \
            M2IMAGE_DISTRO_VERSION=9.8 \
            M2IMAGE_ALIAS=rocky-9.8 \
            M2IMAGE_SBOM_OUTPUT="$PWD/images/compliance/rocky-9.8-x86_64.spdx.json" \
            scripts/firecracker-menual/install-rocky-rootfs.sh
          sudo chown -R "$USER:$USER" images build || true

      - name: Verify real rpm and kernel provenance
        run: |
          python3 - images/compliance/rocky-9.8-x86_64.spdx.json <<'PY'
          import json, sys
          doc = json.load(open(sys.argv[1], encoding='utf-8'))
          assert doc['spdxVersion'] == 'SPDX-2.3'
          packages = doc['packages'][1:]
          assert len(packages) >= 25, len(packages)
          by_name = {p['name']: p for p in packages}
          assert 'kernel-core' in by_name, 'kernel-core missing from SBOM'
          kernel = by_name['kernel-core']
          assert kernel['versionInfo'] and kernel['versionInfo'] != 'NOASSERTION'
          assert 'source-package=' in kernel.get('comment', '')
          annotations = ' '.join(a['comment'] for a in doc.get('annotations', []))
          assert f"kernel-core@{kernel['versionInfo']}" in annotations
          print(f"real Rocky SBOM: {len(packages)} packages, kernel-core={kernel['versionInfo']}")
          PY
