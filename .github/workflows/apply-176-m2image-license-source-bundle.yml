name: Validate 176 M2Image compliance bundle E2E

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  real-image:
    if: github.event.pull_request.head.ref == 'validation/176-m2image-license-source-bundle'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - alias: alpine-3.24.1
            key_package: busybox
            source_type: alpine-aports
            min_packages: 50
          - alias: ubuntu-26.04
            key_package: linux-image-virtual
            source_type: ubuntu-source-package
            min_packages: 100
          - alias: rocky-9.8
            key_package: kernel-core
            source_type: rocky-source-rpm
            min_packages: 150
    steps:
      - uses: actions/checkout@v7
        with:
          ref: validation/176-m2image-license-source-bundle

      - name: Install host image-build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y e2fsprogs file gzip tar curl zstd xz-utils jq

      - name: Build and package real M2Image
        env:
          ZSTD_LEVEL: '1'
          ZSTD_THREADS: '2'
        run: scripts/build-m2images.sh --alias '${{ matrix.alias }}' --arch x86_64

      - name: Verify real compliance evidence
        env:
          ALIAS: '${{ matrix.alias }}'
          KEY_PACKAGE: '${{ matrix.key_package }}'
          SOURCE_TYPE: '${{ matrix.source_type }}'
          MIN_PACKAGES: '${{ matrix.min_packages }}'
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          alias = os.environ['ALIAS']
          key_package = os.environ['KEY_PACKAGE']
          source_type = os.environ['SOURCE_TYPE']
          minimum = int(os.environ['MIN_PACKAGES'])
          root = Path('images/compliance') / f'{alias}-x86_64'
          bundle = json.loads((root / 'bundle.json').read_text())
          source_map = json.loads((root / 'source-map.json').read_text())
          license_index = json.loads((root / 'licenses/index.json').read_text())
          assert bundle['packageCount'] >= minimum, bundle
          assert bundle['licenseFileCount'] >= 1, bundle
          assert (root / 'licenses/GPL-2.0-only.txt').is_file()
          by_name = {p['binaryPackage']: p for p in source_map['packages']}
          assert key_package in by_name, (key_package, sorted(by_name))
          source = by_name[key_package]['source']
          assert source['type'] == source_type, source
          if source_type == 'alpine-aports':
              assert source['sourcePackage'] == 'busybox', source
              assert source.get('repositoryCommit'), source
              assert source.get('metadataUrl', '').endswith(source['repositoryCommit']), source
          elif source_type == 'ubuntu-source-package':
              assert source.get('sourcePackage'), source
              assert source.get('sourceVersion'), source
              assert 'launchpad.net/ubuntu/+source/' in source.get('metadataUrl', ''), source
          elif source_type == 'rocky-source-rpm':
              assert source.get('sourceArtifact', '').endswith('.src.rpm'), source
          print(
              f"{alias}: packages={bundle['packageCount']} "
              f"guest_legal={bundle['guestLegalFileCount']} "
              f"license_files={bundle['licenseFileCount']} "
              f"key_source={source}"
          )
          assert any(item['bundlePath'] == 'licenses/GPL-2.0-only.txt' for item in license_index['files'])
          PY

      - name: Verify packaged archive contract
        env:
          ALIAS: '${{ matrix.alias }}'
        run: |
          archive="dist/m2images/x86_64/${ALIAS}.tar.zst"
          zstd -dc "$archive" | tar -tf - > members.txt
          grep -qx 'compliance/bundle.json' members.txt
          grep -qx 'compliance/sbom.spdx.json' members.txt
          grep -qx 'compliance/source-map.json' members.txt
          grep -qx 'compliance/licenses/index.json' members.txt
          grep -qx 'compliance/licenses/GPL-2.0-only.txt' members.txt
