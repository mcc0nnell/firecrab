name: Apply 176 M2Image license and source bundle

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: github.event.pull_request.head.ref == 'validation/176-m2image-license-source-bundle'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: validation/176-m2image-license-source-bundle

      - name: Apply product patch
        run: python3 .github/validation/apply-176-m2image-license-source-bundle.py

      - name: Focused validation
        run: |
          git diff --check
          python3 -m py_compile scripts/m2image_sbom.py scripts/m2image_compliance.py scripts/test_m2image_sbom.py scripts/test_m2image_compliance.py
          python3 -m unittest scripts/test_m2image_sbom.py scripts/test_m2image_compliance.py
          bash scripts/test-m2image-package-compliance.sh
          shellcheck scripts/build-m2images.sh scripts/package-m2images.sh scripts/collect-m2image-compliance.sh scripts/test-m2image-package-compliance.sh

      - name: Commit validated product changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/m2image_sbom.py scripts/test_m2image_sbom.py scripts/build-m2images.sh scripts/package-m2images.sh scripts/test-m2image-package-compliance.sh
          git commit -m 'feat(compliance): package M2Image license and source evidence'
          git push origin HEAD:validation/176-m2image-license-source-bundle
