name: M2Image real-build coverage

on:
  workflow_dispatch:
  schedule:
    - cron: "23 5 * * 1"

permissions:
  contents: read

concurrency:
  group: m2image-real-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    name: Plan real builds
    runs-on: ubuntu-latest
    outputs:
      aliases: ${{ steps.aliases.outputs.aliases }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Read manifest aliases
        id: aliases
        shell: bash
        run: |
          aliases="$(
            python3 scripts/m2image-manifest.py --manifest packaging/m2images.json aliases |
              python3 -c 'import json, sys; print(json.dumps([line.strip() for line in sys.stdin if line.strip()]))'
          )"
          echo "aliases=${aliases}" >> "$GITHUB_OUTPUT"

  real-build:
    name: ${{ matrix.alias }} / x86_64
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        alias: ${{ fromJSON(needs.plan.outputs.aliases) }}

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install host build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            binutils \
            bzip2 \
            curl \
            dpkg-dev \
            e2fsprogs \
            file \
            jq \
            lz4 \
            lzop \
            xz-utils \
            zstd

      - name: Build and package real M2Image
        run: |
          sudo -n true
          ./scripts/build-m2images.sh \
            --alias "${{ matrix.alias }}" \
            --arch x86_64

      - name: Materialize and package exact sources
        env:
          M2IMAGE_SOURCE_WORKERS: "4"
        run: |
          ./scripts/package-m2image-sources.sh \
            --alias "${{ matrix.alias }}" \
            --arch x86_64

      - name: Verify package checksums
        run: |
          cd dist/m2images/x86_64
          sha256sum -c SHA256SUMS
