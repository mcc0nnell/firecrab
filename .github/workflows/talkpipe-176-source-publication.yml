name: TalkPipe #176 source publication

on:
  pull_request:
    branches: [fix/host-license-artifacts-176]

permissions:
  contents: read

jobs:
  adversary:
    name: TalkPipe source-publication adversary
    if: github.event.pull_request.head.ref == 'validation/176-corresponding-source-publication'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: validation/176-corresponding-source-publication

      - name: Unit tests
        run: |
          python3 -m unittest \
            scripts/test_m2image_sbom.py \
            scripts/test_m2image_compliance.py \
            scripts/test_m2image_source_publication.py

      - name: Source archive and publisher contracts
        run: |
          sudo apt-get update
          sudo apt-get install -y e2fsprogs zstd shellcheck
          shellcheck \
            scripts/collect-m2image-compliance.sh \
            scripts/package-m2images.sh \
            scripts/package-m2image-sources.sh \
            scripts/publish-m2images-r2.sh \
            scripts/test-m2image-package-compliance.sh \
            scripts/test-m2image-source-package.sh \
            scripts/test-m2image-source-publish.sh
          bash scripts/test-m2image-package-compliance.sh
          bash scripts/test-m2image-source-package.sh
          bash scripts/test-m2image-source-publish.sh

      - name: TalkPipe in python:3.12-slim
        run: |
          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            python:3.12-slim \
            bash -lc '
              set -euo pipefail
              apt-get update >/dev/null
              apt-get install -y --no-install-recommends git ca-certificates >/dev/null
              git clone -q https://github.com/sandialabs/talkpipe.git /tmp/talkpipe
              git -C /tmp/talkpipe checkout -q 0ceb36bc1ab31df227c52a5eab990b61abd050bc
              test "$(git -C /tmp/talkpipe rev-parse HEAD)" = 0ceb36bc1ab31df227c52a5eab990b61abd050bc
              pip install --no-cache-dir -q "pydantic>=2.4.0" "numpy>=1.22.2" greenlet
              PYTHONPATH=/tmp/talkpipe/src python3 .github/validation/talkpipe-176-sources.py
            '

  real-source-plan:
    name: Real source (${{ matrix.alias }})
    if: github.event.pull_request.head.ref == 'validation/176-corresponding-source-publication'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        alias: [alpine-3.24.1, ubuntu-26.04, rocky-9.8]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: validation/176-corresponding-source-publication

      - name: Install real-image/source tools
        run: |
          sudo apt-get update
          sudo apt-get install -y e2fsprogs file gzip tar curl zstd xz-utils jq dpkg-dev

      - name: Build real M2Image
        env:
          ZSTD_LEVEL: '1'
          ZSTD_THREADS: '2'
        run: scripts/build-m2images.sh --alias "${{ matrix.alias }}" --arch x86_64

      - name: Require frozen plan inside binary archive
        run: |
          zstd -dc "dist/m2images/x86_64/${{ matrix.alias }}.tar.zst" \
            | tar -tf - \
            | grep -qx 'compliance/source-publication-plan.json'

      - name: Require complete source-publication plan
        run: |
          set -euo pipefail
          root="images/compliance/${{ matrix.alias }}-x86_64"
          python3 scripts/m2image_source_publication.py plan \
            --source-map "$root/source-map.json" \
            --output "$root/source-publication-plan.json"
          python3 - "$root/source-publication-plan.json" <<'PY'
          import json, sys
          plan = json.load(open(sys.argv[1], encoding='utf-8'))
          assert plan['coveragePolicy'] == 'all-installed-packages'
          assert plan['packageCount'] > 0
          assert plan['sourceCount'] > 0
          source_backed = sum(len(item['binaryPackages']) for item in plan['sources'])
          non_source = len(plan['nonSourcePackages'])
          assert source_backed == plan['sourceBackedPackageCount']
          assert non_source == plan['nonSourcePackageCount']
          assert source_backed + non_source == plan['packageCount'], (
              source_backed, non_source, plan['packageCount']
          )
          print(
              'source plan:',
              plan['image']['distribution'],
              f"packages={plan['packageCount']}",
              f"source_backed={source_backed}",
              f"non_source={non_source}",
              f"sources={plan['sourceCount']}",
          )
          PY

      - name: Select representative exact source
        run: |
          root="images/compliance/${{ matrix.alias }}-x86_64"
          python3 - "$root/source-publication-plan.json" representative-plan.json <<'PY'
          import json, sys
          plan = json.load(open(sys.argv[1], encoding='utf-8'))
          distro = plan['image']['distribution']
          if distro == 'alpine':
              predicate = lambda unit: unit['source'].get('sourcePackage') == 'busybox'
          elif distro == 'ubuntu':
              predicate = lambda unit: unit['source'].get('sourcePackage', '').startswith('linux')
          elif distro == 'rocky':
              predicate = lambda unit: unit['source'].get('sourceArtifact', '').startswith('kernel-')
          else:
              raise SystemExit(f'unsupported representative distro: {distro}')
          unit = next((item for item in plan['sources'] if predicate(item)), None)
          if unit is None:
              raise SystemExit(f'no representative source unit found for {distro}')
          count = len(unit['binaryPackages'])
          reduced = {
              'schemaVersion': 1,
              'coveragePolicy': 'all-installed-packages',
              'image': plan['image'],
              'packageCount': count,
              'sourceBackedPackageCount': count,
              'nonSourcePackageCount': 0,
              'sourceCount': 1,
              'sources': [unit],
              'nonSourcePackages': [],
          }
          json.dump(reduced, open(sys.argv[2], 'w', encoding='utf-8'), indent=2, sort_keys=True)
          print('representative source:', distro, unit['source'])
          PY

      - name: Fetch and hash representative matching source
        run: |
          python3 scripts/fetch_m2image_sources.py \
            --plan representative-plan.json \
            --output-dir representative-source
          python3 - <<'PY'
          import json
          from pathlib import Path
          index = json.loads(Path('representative-source/source-index.json').read_text())
          plan = json.loads(Path('representative-source/source-publication-plan.json').read_text())
          assert index['packageCount'] == plan['packageCount']
          assert index['sourceCount'] == 1
          assert index['fileCount'] > 0
          assert index['sources'][0]['source'] == plan['sources'][0]['source']
          assert all(len(item['sha256']) == 64 for item in index['sources'][0]['files'])
          print(
              'matching source verified:',
              index['image']['distribution'],
              f"files={index['fileCount']}",
              f"packages={index['packageCount']}",
          )
          PY

  full-alpine-source-archive:
    name: Full source archive (alpine-3.24.1)
    if: github.event.pull_request.head.ref == 'validation/176-corresponding-source-publication'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: validation/176-corresponding-source-publication

      - name: Install real-image/source tools
        run: |
          sudo apt-get update
          sudo apt-get install -y e2fsprogs file gzip tar curl zstd xz-utils jq dpkg-dev

      - name: Prime Alpine source fetch toolchain
        run: |
          set -euo pipefail
          docker build -t firecrab-alpine-source-fetch:3.24 - <<'DOCKERFILE'
          FROM alpine:3.24
          RUN apk add --no-cache alpine-sdk
          DOCKERFILE
          # The fetcher intentionally uses the distribution image name. In this
          # disposable validation runner, retag the prepared child so all 47
          # source units reuse alpine-sdk instead of reinstalling it 47 times.
          docker tag firecrab-alpine-source-fetch:3.24 alpine:3.24

      - name: Build Alpine M2Image and frozen source plan
        env:
          ZSTD_LEVEL: '1'
          ZSTD_THREADS: '2'
        run: scripts/build-m2images.sh --alias alpine-3.24.1 --arch x86_64

      - name: Prime exact aports commits
        run: |
          set -euo pipefail
          plan=images/compliance/alpine-3.24.1-x86_64/source-publication-plan.json
          cache=.cache/m2image-sources/aports.git
          mkdir -p "$(dirname "$cache")"
          git init --bare "$cache"
          git --git-dir="$cache" remote add origin https://gitlab.alpinelinux.org/alpine/aports.git
          mapfile -t commits < <(python3 - "$plan" <<'PY'
          import json, sys
          plan = json.load(open(sys.argv[1], encoding='utf-8'))
          print('\n'.join(sorted({item['source']['repositoryCommit'] for item in plan['sources']})))
          PY
          )
          echo "priming ${#commits[@]} exact aports commits"
          if ! git --git-dir="$cache" fetch --depth=1 origin "${commits[@]}"; then
            echo 'batch commit fetch unavailable; falling back to exact commits one by one'
            for commit in "${commits[@]}"; do
              git --git-dir="$cache" cat-file -e "${commit}^{commit}" 2>/dev/null \
                || git --git-dir="$cache" fetch --depth=1 origin "$commit"
            done
          fi

      - name: Materialize every installed package source and package it
        env:
          ZSTD_LEVEL: '1'
          ZSTD_THREADS: '2'
        run: |
          scripts/package-m2image-sources.sh --alias alpine-3.24.1 --arch x86_64

      - name: Verify complete exact-source archive
        run: |
          set -euo pipefail
          archive=dist/m2images/x86_64/alpine-3.24.1.sources.tar.zst
          verify=$(mktemp -d)
          trap 'rm -rf "$verify"' EXIT
          zstd -dc "$archive" | tar -x -C "$verify" \
            source-publication-plan.json source-index.json
          python3 - "$verify/source-publication-plan.json" "$verify/source-index.json" <<'PY'
          import json, sys
          plan = json.load(open(sys.argv[1], encoding='utf-8'))
          index = json.load(open(sys.argv[2], encoding='utf-8'))
          assert index['coveragePolicy'] == 'all-installed-packages'
          assert index['packageCount'] == plan['packageCount']
          assert index['sourceBackedPackageCount'] == plan['sourceBackedPackageCount']
          assert index['nonSourcePackageCount'] == plan['nonSourcePackageCount']
          assert index['sourceCount'] == plan['sourceCount']
          assert index['fileCount'] >= index['sourceCount'] > 0
          assert all(item['files'] for item in index['sources'])
          print(
              'full exact-source archive:',
              f"packages={index['packageCount']}",
              f"sources={index['sourceCount']}",
              f"files={index['fileCount']}",
          )
          PY
          (cd dist/m2images/x86_64 && sha256sum -c SHA256SUMS)
