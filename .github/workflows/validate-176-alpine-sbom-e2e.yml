name: Validate 176 Alpine M2Image SBOM end to end

on:
  pull_request:
    branches: [main]

jobs:
  alpine-x86_64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install host image-build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y e2fsprogs file gzip tar curl zstd

      - name: Build Alpine M2Image with real package DB SBOM
        run: |
          mkdir -p images/compliance
          sudo env \
            M2IMAGE_ARCH=x86_64 \
            M2IMAGE_ALIAS=alpine-3.24.1 \
            M2IMAGE_SBOM_OUTPUT="$PWD/images/compliance/alpine-3.24.1-x86_64.spdx.json" \
            scripts/firecracker-menual/install-alpine-rootfs.sh
          sudo chown -R "$USER:$USER" images build || true

      - name: Verify real package and kernel provenance
        run: |
          python3 - images/compliance/alpine-3.24.1-x86_64.spdx.json <<'PY'
          import json, sys
          doc = json.load(open(sys.argv[1], encoding='utf-8'))
          assert doc['spdxVersion'] == 'SPDX-2.3'
          packages = doc['packages'][1:]
          by_name = {p['name']: p for p in packages}
          assert len(packages) >= 10, len(packages)
          assert 'busybox' in by_name
          assert 'linux-virt' in by_name
          kernel = by_name['linux-virt']['versionInfo']
          assert kernel and kernel != 'NOASSERTION'
          annotations = ' '.join(a['comment'] for a in doc.get('annotations', []))
          assert f'linux-virt@{kernel}' in annotations
          print(f"real Alpine SBOM: {len(packages)} packages, linux-virt={kernel}")
          PY

      - name: Package and verify SBOM archive member
        run: |
          OUT_DIR="$PWD/dist/m2images/x86_64" ZSTD_LEVEL=1 ZSTD_THREADS=2 \
            scripts/package-m2images.sh --alias alpine-3.24.1 --arch x86_64
          archive=dist/m2images/x86_64/alpine-3.24.1.tar.zst
          zstd -dc "$archive" | tar -tf - | grep -qx 'compliance/sbom.spdx.json'
          source_sha=$(sha256sum images/compliance/alpine-3.24.1-x86_64.spdx.json | awk '{print $1}')
          packed_sha=$(zstd -dc "$archive" | tar -xOf - compliance/sbom.spdx.json | sha256sum | awk '{print $1}')
          test "$source_sha" = "$packed_sha"
          echo "packaged SBOM sha256=$packed_sha"
